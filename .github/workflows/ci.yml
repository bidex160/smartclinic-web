name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - 'audit/**'

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: |
          set +e
          npm test -- --watch=false
          first=$?
          set -e
          if [ "$first" -ne 0 ]; then
            echo "First test pass failed; retrying once to distinguish Angular/Vitest discovery flake from a deterministic failure."
            npm test -- --watch=false
          fi
