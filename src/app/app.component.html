<div class="flex min-h-screen flex-col bg-[#f7faf9] text-ink">
  <a
    class="sr-only z-50 rounded-md bg-white px-4 py-3 font-semibold text-brand-800 focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:outline-none focus:ring-4 focus:ring-brand-200"
    href="#main-content"
    >Skip to main content</a
  >
  <header class="border-b border-emerald-950/10 bg-white/95">
    <div
      class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-4 sm:px-8 lg:px-10"
    >
      <a
        routerLink="/"
        class="group inline-flex items-center gap-3 rounded-md focus:outline-none focus:ring-4 focus:ring-brand-200"
        aria-label="SmartClinic home"
      >
        <span
          class="grid size-10 place-items-center rounded-xl bg-brand-600 text-xl font-bold text-white shadow-sm"
          aria-hidden="true"
          >S</span
        >
        <span class="text-xl font-bold tracking-tight text-brand-900">SmartClinic</span>
      </a>
      <nav aria-label="Primary navigation">
        @if (authState.authenticated()) {
          <a
            routerLink="/me/health-checks"
            routerLinkActive="bg-brand-50 text-brand-800"
            class="inline-flex min-h-11 items-center rounded-full px-4 text-sm font-semibold text-brand-700 transition hover:bg-brand-50 focus:outline-none focus:ring-4 focus:ring-brand-200"
            >My Health Checks</a
          >
        }
        <a
          routerLink="/health-check/packages"
          routerLinkActive="bg-brand-50 text-brand-800"
          class="inline-flex min-h-11 items-center rounded-full px-4 text-sm font-semibold text-brand-700 transition hover:bg-brand-50 focus:outline-none focus:ring-4 focus:ring-brand-200"
          >Health checks</a
        >
      </nav>
    </div>
  </header>
  <main id="main-content" class="flex-1" tabindex="-1"><router-outlet /></main>
  <footer class="border-t border-emerald-950/10 bg-white">
    <div
      class="mx-auto flex max-w-7xl flex-col gap-2 px-5 py-7 text-sm text-slate-600 sm:px-8 md:flex-row md:items-center md:justify-between lg:px-10"
    >
      <p>&copy; 2026 SmartClinic. Your health journey, made clearer.</p>
      <p>Health checks do not replace urgent or emergency care.</p>
    </div>
  </footer>
</div>
